[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-agent-bridge-mcp"
version = "1.3.3"
description = "Standard MCP server for controlling the workflow open in a ComfyUI browser"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.20,<2",
]

[project.scripts]
comfyui-agent-bridge-mcp = "comfyui_agent_bridge_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
