<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">ComfyUI Agent Bridge</title>
  <desc id="desc">A ComfyUI workflow node connected to the bridge.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#201331"/></linearGradient>
    <linearGradient id="edge" x2="1"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <path d="M60 236h440" stroke="#a78bfa" stroke-opacity=".55" stroke-width="2"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="125" fill="#f5f3ff" font-size="57" font-weight="700">ComfyUI</text>
    <text x="60" y="195" fill="#c4b5fd" font-size="57" font-weight="700">Agent Bridge</text>
    <text x="60" y="269" fill="#a9a1b9" font-size="17">Current canvas · Local MCP</text>
  </g>
  <path d="M670 150h114" fill="none" stroke="#a78bfa" stroke-width="3"/>
  <circle cx="670" cy="150" r="7" fill="#a78bfa"/>
  <circle cx="784" cy="150" r="7" fill="#a78bfa"/>
  <rect x="784" y="55" width="345" height="190" rx="15" fill="#8b5cf6" fill-opacity=".45" filter="url(#glow)"/>
  <rect x="784" y="55" width="345" height="190" rx="15" fill="#1e1930" stroke="url(#edge)" stroke-width="2"/>
  <path d="M784 105h345" stroke="#665581"/>
  <g font-family="Arial, sans-serif">
    <text x="810" y="88" fill="#f5f3ff" font-size="21" font-weight="700">KSampler</text>
    <text x="810" y="145" fill="#aaa1bd" font-size="16">steps</text>
    <text x="1101" y="145" fill="#e9d5ff" font-size="16" text-anchor="end">24</text>
    <text x="810" y="181" fill="#aaa1bd" font-size="16">cfg</text>
    <text x="1101" y="181" fill="#e9d5ff" font-size="16" text-anchor="end">7.0</text>
    <text x="810" y="217" fill="#aaa1bd" font-size="16">sampler_name</text>
    <text x="1101" y="217" fill="#e9d5ff" font-size="16" text-anchor="end">euler</text>
  </g>
</svg>
